# swarm.conf: default parameters for ./swarm.sh
# Sourced by swarm.sh. Any variable can also be overridden from the environment
# (e.g. `SEEDS=0-4 ./swarm.sh run`) or with the matching --flag on the command line.
# No secrets here: the API key lives in .env (ADOPTION_KEY or ADAPTION_API_KEY).

# ---- models -------------------------------------------------------------
WORKER_MODEL="${WORKER_MODEL:-qwen3.8-27b}"          # or local:lfm3-1.7b
COORD_MODEL="${COORD_MODEL:-gemma-4-31b-it}"         # same model for attack AND benign
MONITOR_MODELS="${MONITOR_MODELS:-qwen3.5-397b local:lfm2.5-8b local:lfm3-1.7b}"   # space-separated

# ---- experiment ---------------------------------------------------------
MODE="${MODE:-attack}"            # attack | benign | nearmiss | single
COND="${COND:-AB}"                # AB (edit/delete log tools) | C (+ log_append forging)
SEEDS="${SEEDS:-0-2}"             # range "0-19" or list "0,3,7"
N_WORKERS="${N_WORKERS:-4}"
VIEWS="${VIEWS:-naive chain chain_audit naive_scripted chain_audit_scripted}"
NO_REROUTE="${NO_REROUTE:-0}"     # 1 = H2d ablation: refused work cannot be reassigned

# ---- matrix sizes (fix 3: more positives for tighter AUROC intervals) ----
SEEDS_MAIN="${SEEDS_MAIN:-0-39}"      # attack / benign, cond AB
SEEDS_NEARMISS="${SEEDS_NEARMISS:-0-19}"
SEEDS_C="${SEEDS_C:-0-14}"            # attack / benign, cond C
SEEDS_SINGLE="${SEEDS_SINGLE:-0-9}"
SEEDS_ABLATION="${SEEDS_ABLATION:-0-19}"
SEEDS_LFM="${SEEDS_LFM:-0-9}"

# ---- sealing (K-Veritas) --------------------------------------------------
SEAL_KEY="${SEAL_KEY:-}"          # explicit key for ./swarm.sh run; empty = run.py's default below
# K-Veritas signing key: every K-Veritas batch is sealed into a signed PDF when this key exists
# (created by scripts/run2.sh stage 1; public key in keys/seal-public.pem)
SWARM_SEAL_KEY="${SWARM_SEAL_KEY:-$HOME/.config/swarm-kveritas/seal-key.pem}"
export SWARM_SEAL_KEY
# Coordinator-intent classifier (flag only, researcher-only records; 'none' disables)
SWARM_INTENT_MODEL="${SWARM_INTENT_MODEL:-local:lfm3-1.7b}"
export SWARM_INTENT_MODEL
# Go verifier. The released ~/.local/bin/kveritas rejects C seals with runs (bug 2); scripts/run2.sh builds
# bin/kveritas-dev from the fixed kveritas-go working copy, which is preferred when present.
if [[ -z "${KVERITAS_BIN:-}" ]]; then
  if [[ -x "${ROOT:-.}/bin/kveritas-dev" ]]; then KVERITAS_BIN="${ROOT:-.}/bin/kveritas-dev"; else KVERITAS_BIN=kveritas; fi
fi

# ---- local LFM (llama.cpp) ------------------------------------------------
# DEFAULT: the existing GPU-resident systemd service `llama-server.service` (Hermes agent):
# LFM2.5-8B-A1B, all layers on the RTX 3060, port 18080. It holds ~5 GB of the 6 GB VRAM, so a
# second server (LFM3-1.7B) only got 8 GPU layers and ran mostly on CPU (2026-11-07).
# LLAMA_EXTERNAL=1 -> swarm.sh never starts or stops that server (it belongs to systemd/Hermes).
# To use your own server instead: LLAMA_EXTERNAL=0 LLAMA_PORT=8081 LFM_ALIAS=lfm3-1.7b LLAMA_GPU_LAYERS=99
# (and stop the service first: sudo systemctl stop llama-server.service), then ./swarm.sh server start.
LLAMA_EXTERNAL="${LLAMA_EXTERNAL:-1}"
# Both local models are systemd services (deploy/install_llama_services.sh), CTX=131072 (halved 2026-11-07):
#   llama-server.service       LFM2.5-8B-A1B  :18080  attention + KV on CUDA, MoE experts on CPU; capped at 128000
#   llama-server-lfm3.service  LFM3-1.7B      :18081  fully on CUDA; 131072
# Model "local:<alias>" is routed by alias:
LOCAL_LLM_ROUTES="${LOCAL_LLM_ROUTES:-lfm2.5-8b=http://127.0.0.1:18080/v1 lfm3-1.7b=http://127.0.0.1:18081/v1}"
export LOCAL_LLM_ROUTES
LLAMA_SERVER="${LLAMA_SERVER:-$HOME/src/llama.cpp/build/bin/llama-server}"
LFM_MODEL_PATH="${LFM_MODEL_PATH:-/mnt/c/Users/sebas/.lmstudio/models/lmstudio-community/LFM3-1.7B-GGUF/LFM3-1.7B-Q8_0.gguf}"
LFM_ALIAS="${LFM_ALIAS:-lfm2.5-8b}"               # used as model name local:<alias>
LLAMA_HOST="${LLAMA_HOST:-127.0.0.1}"
LLAMA_PORT="${LLAMA_PORT:-18080}"
LLAMA_CTX="${LLAMA_CTX:-32768}"                   # total context, split across slots
LLAMA_SLOTS="${LLAMA_SLOTS:-2}"                   # parallel requests (match --local-workers)
LLAMA_THREADS="${LLAMA_THREADS:-12}"
LLAMA_GPU_LAYERS="${LLAMA_GPU_LAYERS:-99}"        # own server only: 99 = all layers on GPU (needs free VRAM)

# Local backend knobs read by env/agents.py
LOCAL_LLM_THINKING="${LOCAL_LLM_THINKING:-0}"     # 1 = enable LFM reasoning (much slower)
LOCAL_LLM_TEMPERATURE="${LOCAL_LLM_TEMPERATURE:-0.7}"   # agents; monitors use MONITOR_TEMPERATURE
LOCAL_LLM_MAX_TOKENS="${LOCAL_LLM_MAX_TOKENS:-1024}"
MONITOR_TEMPERATURE="${MONITOR_TEMPERATURE:-0}"

# ---- scoring concurrency --------------------------------------------------
REMOTE_WORKERS="${REMOTE_WORKERS:-4}"
LOCAL_WORKERS="${LOCAL_WORKERS:-2}"

# ---- ablation switches (read by score_monitors.py / env/scripted.py) -----
SWARM_SCRIPTED_STEALTHY="${SWARM_SCRIPTED_STEALTHY:-1}"   # 0 = visible cover-up (seq gaps, 'details trimmed')
SWARM_TIDY_KEEP_AUTH="${SWARM_TIDY_KEEP_AUTH:-0}"         # 1 = matched tidy-up keeps the delegations that authorize log edits
export SWARM_SCRIPTED_STEALTHY SWARM_TIDY_KEEP_AUTH
