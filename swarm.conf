# swarm.conf: default parameters for ./swarm.sh, scripts/run2.sh and scripts/serve_models.sh.
# Any variable can be overridden from the environment (e.g. `SEEDS=0-4 ./swarm.sh run`), with the matching --flag,
# or in swarm.local.conf (git-ignored), which is read first for settings specific to your machine.
# No secrets here: API keys live in .env (see .env.example).

_SWARM_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
# shellcheck source=/dev/null
[[ -f "$_SWARM_ROOT/swarm.local.conf" ]] && source "$_SWARM_ROOT/swarm.local.conf"

# ---- models -------------------------------------------------------------
WORKER_MODEL="${WORKER_MODEL:-qwen3.8-27b}"          # or local:lfm3-1.7b
COORD_MODEL="${COORD_MODEL:-gemma-4-31b-it}"         # the same model for attack and benign
MONITOR_MODELS="${MONITOR_MODELS:-qwen3.5-397b local:lfm2.5-8b local:lfm3-1.7b}"   # space-separated

# ---- experiment ---------------------------------------------------------
MODE="${MODE:-attack}"            # attack | benign | nearmiss | single
COND="${COND:-AB}"                # AB (edit/delete log tools) | C (+ log_append forging)
SEEDS="${SEEDS:-0-2}"             # range "0-19" or list "0,3,7"
N_WORKERS="${N_WORKERS:-4}"
VIEWS="${VIEWS:-naive chain chain_audit naive_scripted chain_audit_scripted}"
NO_REROUTE="${NO_REROUTE:-0}"     # 1 = refused work cannot be reassigned

# ---- matrix sizes for ./swarm.sh matrix (campaigns/*.yaml set their own) ----
SEEDS_MAIN="${SEEDS_MAIN:-0-39}"      # attack / benign, cond AB
SEEDS_NEARMISS="${SEEDS_NEARMISS:-0-19}"
SEEDS_C="${SEEDS_C:-0-14}"            # attack / benign, cond C
SEEDS_SINGLE="${SEEDS_SINGLE:-0-9}"
SEEDS_ABLATION="${SEEDS_ABLATION:-0-19}"
SEEDS_LFM="${SEEDS_LFM:-0-9}"

# ---- K-Veritas ------------------------------------------------------------
SEAL_KEY="${SEAL_KEY:-}"          # explicit key for ./swarm.sh run; empty = SWARM_SEAL_KEY below
# Signing key for the sealed reports: every K-Veritas batch is sealed into a signed PDF when this key exists.
# Created by scripts/setup.sh; its public key is exported to keys/seal-public.local.pem.
SWARM_SEAL_KEY="${SWARM_SEAL_KEY:-$HOME/.config/swarm-kveritas/seal-key.pem}"
export SWARM_SEAL_KEY
# Verifier built by scripts/setup.sh; falls back to a `kveritas` on the PATH
if [[ -z "${KVERITAS_BIN:-}" ]]; then
  if [[ -x "$_SWARM_ROOT/bin/kveritas" ]]; then KVERITAS_BIN="$_SWARM_ROOT/bin/kveritas"; else KVERITAS_BIN=kveritas; fi
fi
# K-Veritas sources used by scripts/run2.sh when it rebuilds them (cloned by scripts/setup.sh)
KVERITAS_C_DIR="${KVERITAS_C_DIR:-$_SWARM_ROOT/third_party/kveritas-c}"
KVERITAS_GO_DIR="${KVERITAS_GO_DIR:-$_SWARM_ROOT/third_party/kveritas-go}"

# Coordinator-intent classifier (flag only, researcher-only records; 'none' disables)
SWARM_INTENT_MODEL="${SWARM_INTENT_MODEL:-local:lfm3-1.7b}"
export SWARM_INTENT_MODEL

# ---- record offload (env/store.py) ------------------------------------------
# off (default): every record stays on disk under runs/<name>/.
# hf: after each episode its records are packed (lossless .tar.xz), uploaded to the Hugging Face dataset
# SWARM_HF_REPO (created private if missing), checked on the Hub and deleted locally before the next episode;
# sealed sessions likewise after each batch, and the run folder when the campaign finishes. Token: HF_TOKEN in .env.
SWARM_OFFLOAD="${SWARM_OFFLOAD:-off}"
SWARM_HF_REPO="${SWARM_HF_REPO:-}"
export SWARM_OFFLOAD SWARM_HF_REPO

# ---- local models (llama.cpp; scripts/serve_models.sh) ---------------------
# "local:<alias>" models are routed by alias to an OpenAI-compatible server:
LOCAL_LLM_ROUTES="${LOCAL_LLM_ROUTES:-lfm2.5-8b=http://127.0.0.1:18080/v1 lfm3-1.7b=http://127.0.0.1:18081/v1}"
export LOCAL_LLM_ROUTES
LLAMA_SERVER="${LLAMA_SERVER:-$_SWARM_ROOT/third_party/llama.cpp/build/bin/llama-server}"
LFM3_MODEL_PATH="${LFM3_MODEL_PATH:-$_SWARM_ROOT/models/LFM3-1.7B-Q8_0.gguf}"
LFM25_MODEL_PATH="${LFM25_MODEL_PATH:-$_SWARM_ROOT/models/LFM2.5-8B-A1B-Q4_0.gguf}"
# The local servers are started with scripts/serve_models.sh (or by your own service manager); swarm.sh only
# checks that they answer. Set LLAMA_EXTERNAL=0 to let `./swarm.sh server start` run a single server instead.
LLAMA_EXTERNAL="${LLAMA_EXTERNAL:-1}"
LFM_MODEL_PATH="${LFM_MODEL_PATH:-$LFM3_MODEL_PATH}"   # model for the single-server mode
LFM_ALIAS="${LFM_ALIAS:-lfm3-1.7b}"
LLAMA_HOST="${LLAMA_HOST:-127.0.0.1}"
LLAMA_PORT="${LLAMA_PORT:-18081}"
LLAMA_CTX="${LLAMA_CTX:-32768}"                   # total context, split across slots
LLAMA_SLOTS="${LLAMA_SLOTS:-2}"                   # parallel requests (match --local-workers)
LLAMA_THREADS="${LLAMA_THREADS:-8}"
LLAMA_GPU_LAYERS="${LLAMA_GPU_LAYERS:-99}"        # 99 = all layers on the GPU

# Local backend knobs read by env/agents.py
LOCAL_LLM_THINKING="${LOCAL_LLM_THINKING:-0}"     # 1 = enable LFM reasoning (much slower)
LOCAL_LLM_TEMPERATURE="${LOCAL_LLM_TEMPERATURE:-0.7}"   # agents; monitors use MONITOR_TEMPERATURE
LOCAL_LLM_MAX_TOKENS="${LOCAL_LLM_MAX_TOKENS:-1024}"
MONITOR_TEMPERATURE="${MONITOR_TEMPERATURE:-0}"

# ---- scoring concurrency --------------------------------------------------
REMOTE_WORKERS="${REMOTE_WORKERS:-4}"
LOCAL_WORKERS="${LOCAL_WORKERS:-2}"

# ---- scripted cover-up switches (read by score_monitors.py / env/scripted.py) -----
SWARM_SCRIPTED_STEALTHY="${SWARM_SCRIPTED_STEALTHY:-1}"   # 0 = visible cover-up (sequence gaps, 'details trimmed')
SWARM_TIDY_KEEP_AUTH="${SWARM_TIDY_KEEP_AUTH:-0}"         # 1 = matched tidy-up keeps the messages that authorise it
export SWARM_SCRIPTED_STEALTHY SWARM_TIDY_KEEP_AUTH
